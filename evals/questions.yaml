# Longitudinal Q&A. Each `must_match` entry is a case-insensitive regex; an answer
# scores fact-recall only if every one of them is present. `gold` is what a correct
# answer contains, used by the LLM judge.
#
# needs_memory: true marks questions unanswerable without the patient's history --
# these are the ones that separate the arms.

- id: maya_propranolol_now
  patient: maya
  needs_memory: true
  question: "Am I still taking propranolol, and at what dose?"
  must_match: ["40 ?mg", "propranolol"]
  gold: >-
    Yes. Propranolol 40mg once daily since 2026-07-07, increased from the 20mg
    daily started on 2026-01-13.

- id: maya_rash_pattern
  patient: maya
  needs_memory: true
  question: "Has this rash happened before?"
  must_match: ["amoxicillin", "2025-09|september 2025", "2026-05|may 2026"]
  gold: >-
    Yes, twice. A blotchy red rash on the trunk and inner arms on 2025-09-17 and
    again on 2026-05-22. On both occasions it began within a few days of starting
    amoxicillin and settled in about three days after stopping it. This is worth
    raising with a clinician; no drug allergy is recorded.

- id: maya_stopping_effect
  patient: maya
  needs_memory: true
  question: "Did stopping the propranolol change anything?"
  must_match: ["five|5", "migraine"]
  gold: >-
    Yes. Propranolol was stopped on 2026-04-06 and restarted on 2026-04-27. In
    those 21 days there were five migraines, against roughly two a month while
    taking it.

- id: maya_mri
  patient: maya
  needs_memory: true
  question: "What did my doctor want me to follow up on?"
  must_match: ["mri", "2026-06-09|june"]
  gold: >-
    At the 2026-06-09 appointment the GP said that if migraine frequency crept up
    or the pattern changed, imaging -- an MRI -- would be the next step. It has
    not been followed up.

- id: maya_migraine_trend
  patient: maya
  needs_memory: true
  question: "How have my migraines changed over the past year?"
  must_match: ["propranolol", "migraine"]
  gold: >-
    Rising through late 2025 (five in November), falling to one or two a month
    after propranolol started 2026-01-13, spiking to five in three weeks off it in
    April, back to two a month, four in June, then two a month after the increase
    to 40mg on 2026-07-07.

- id: maya_allergy_record
  patient: maya
  needs_memory: true
  question: "What do my records say about drug allergies?"
  must_match: ["no|none|not", "amoxicillin"]
  gold: >-
    No allergies are recorded -- "none" was given on the 2025-09-12 intake form and
    again at urgent care on 2026-05-19. But a rash followed amoxicillin on two
    separate occasions, which contradicts that and is worth raising.

- id: maya_first_rash_theory
  patient: maya
  needs_memory: true
  question: "What did I think caused the rash the first time?"
  must_match: ["detergent"]
  gold: >-
    Laundry detergent -- a brand had been switched the week before 2025-09-17. That
    explanation was abandoned by 2026-05-22, since the same brand had been in use
    for eight months by then.

- id: maya_bp_lowest
  patient: maya
  needs_memory: true
  question: "What's the lowest blood pressure I've recorded?"
  must_match: ["100/64", "2026-07-23|july"]
  gold: "100/64 on 2026-07-23, alongside a note about feeling briefly dizzy on standing."

- id: maya_sumatriptan
  patient: maya
  needs_memory: true
  question: "When do I take sumatriptan versus propranolol?"
  must_match: ["sumatriptan", "propranolol", "daily|prevent|every day"]
  gold: >-
    Sumatriptan 50mg is the rescue, taken at the first sign of a migraine.
    Propranolol is preventive, taken daily regardless of symptoms. Both from 2026-01-13.

- id: maya_tiredness
  patient: maya
  needs_memory: true
  question: "How long have I been complaining about being tired?"
  must_match: ["propranolol|january|2026-01"]
  gold: >-
    Since starting propranolol on 2026-01-13, first noted 2026-01-16 and recurring
    throughout; it eased during the April break and worsened again after the July
    increase to 40mg.

- id: maya_questions_pending
  patient: maya
  needs_memory: true
  question: "What did I want to ask at my next appointment?"
  must_match: ["40 ?mg|dose", "tired|tiredness|fatigue"]
  gold: >-
    From 2026-08-25: whether 40mg is right long term, whether the constant tiredness
    is something to live with or has an alternative, and whether the MRI is still
    needed now things have settled.

- id: maya_ankle
  patient: maya
  needs_memory: true
  question: "Did I ever injure my ankle?"
  must_match: ["2025-08|august"]
  gold: "Yes, rolled on a trail, recorded 2025-08-11; swollen and bruised, resolved within a week."

- id: maya_sinus_count
  patient: maya
  needs_memory: true
  question: "How many sinus infections have I had?"
  must_match: ["two|2"]
  gold: "Two on record: 2025-09-12 and 2026-05-19, both treated with amoxicillin."

- id: maya_negative_check
  patient: maya
  needs_memory: true
  question: "Have I ever recorded chest pain?"
  must_match: ["no|not|never|nothing"]
  gold: "No. There is no record of chest pain anywhere in the journal."

- id: arjun_cholesterol_conflict
  patient: arjun
  needs_memory: true
  question: "Am I taking anything for cholesterol?"
  must_match: ["atorvastatin"]
  gold: >-
    Yes -- atorvastatin 20mg at night, recorded from 2025-09-10 and still being
    collected as of 2026-07-22. Note the contradiction: on 2026-04-02 a
    physiotherapist was told there was nothing for cholesterol.

- id: arjun_amlodipine
  patient: arjun
  needs_memory: true
  question: "Am I still on amlodipine?"
  must_match: ["stopped|no longer|discontinued", "ankle|swelling"]
  gold: >-
    No. Amlodipine was stopped around 2025-11-19 because of ankle swelling, confirmed
    on 2025-12-08. It was still listed as current on a pre-op form on 2026-06-15,
    which is an error worth correcting.

- id: arjun_metformin_dose
  patient: arjun
  needs_memory: true
  question: "What dose of metformin am I on and when did it change?"
  must_match: ["1000 ?mg", "2026-01-20|january"]
  gold: "1000mg twice daily since 2026-01-20, increased from 500mg twice daily."

- id: arjun_bp_meds
  patient: arjun
  needs_memory: true
  question: "What am I taking for blood pressure?"
  must_match: ["lisinopril", "20 ?mg"]
  gold: >-
    Lisinopril 20mg once daily since 2026-03-11, up from 10mg. Amlodipine was
    stopped in November 2025 and not restarted.

- id: arjun_cough
  patient: arjun
  needs_memory: true
  question: "How long have I had this cough?"
  must_match: ["2026-03|march|lisinopril"]
  gold: >-
    A dry cough was first noted 2026-03-25, shortly after the lisinopril increase on
    2026-03-11, and was still present on 2026-08-12.

- id: arjun_hba1c
  patient: arjun
  needs_memory: true
  question: "How has my HbA1c changed?"
  must_match: ["8\\.1", "7\\.2"]
  gold: "8.1 on 2026-01-07, down to 7.2 on 2026-05-06 after the metformin increase."

- id: rosa_surgery_date
  patient: rosa
  needs_memory: true
  question: "When was my knee replaced?"
  must_match: ["2026-04-1[34]|april"]
  gold: "Right total knee replacement on 2026-04-13, first journal entry 2026-04-14."

- id: rosa_infection
  patient: rosa
  needs_memory: true
  question: "Did I have any complications after surgery?"
  must_match: ["infection", "cephalexin|antibiotic"]
  gold: >-
    Yes, a superficial wound infection identified 2026-04-29, treated with cephalexin
    500mg four times daily for seven days. Resolved by 2026-05-06.

- id: rosa_pt_lapse
  patient: rosa
  needs_memory: true
  question: "Did skipping physio actually make a difference?"
  must_match: ["8[28]", "bend|flexion|degrees"]
  gold: >-
    Yes and measurably. After roughly three weeks of not doing the exercises from
    2026-06-11, the bend fell from 88 to 82 degrees by 2026-06-26. It recovered to
    90 degrees by 2026-07-10 after resuming.

- id: rosa_pain_trend
  patient: rosa
  needs_memory: true
  question: "How has my pain changed since the operation?"
  must_match: ["8", "2"]
  gold: "From 8/10 on 2026-04-14 down to 2/10 by 2026-07-25, with a plateau around 5/10 during the wound infection."

- id: rosa_opioid
  patient: rosa
  needs_memory: true
  question: "How long was I on the strong painkillers?"
  must_match: ["oxycodone", "2026-04-25|eleven|11|twelve|12"]
  gold: >-
    Oxycodone 5mg was started at surgery and stopped on 2026-04-25 -- about eleven
    days -- because of fogginess and constipation.

- id: rosa_questions
  patient: rosa
  needs_memory: true
  question: "What do I want to ask at my next review?"
  must_match: ["cycl", "swell"]
  gold: "From 2026-08-24: when cycling can resume, and whether evening swelling is expected this far along."
