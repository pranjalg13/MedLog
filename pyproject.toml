[project]
name = "medlog"
version = "0.1.0"
description = "Memory-native pre-visit brief generator, built on mem0"
requires-python = ">=3.10"
dependencies = [
    "mem0ai>=2.0.0",
    "anthropic>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pandas>=2.2.0",
    "altair>=5.4.0",
    "markdown-it-py>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["medlog*"]
